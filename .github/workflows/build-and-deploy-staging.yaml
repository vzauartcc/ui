name: Build and Deploy Staging

on:
  push:
    branches:
      - 'staging'
  workflow_dispatch:

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest
    if: |
      !(github.event.head_commit.author.email == '29139614+renovate[bot]@users.noreply.github.com' ||
      github.event.head_commit.committer.email == '29139614+renovate[bot]@users.noreply.github.com')

    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          tags: |
            ghcr.io/vzauartcc/ui:${{ github.sha }}
            ghcr.io/vzauartcc/ui:latest
            ghcr.io/vzauartcc/ui:buildcache
          cache-from: type=registry,ref=ghcr.io/vzauartcc/ui:buildcache
          cache-to: type=registry,ref=ghcr.io/vzauartcc/ui:buildcache,mode=max

  Deploy-to-Staging:
    needs: Build-and-Push
    environment: staging
    runs-on: ubuntu-latest
    if: |
      !(github.event.head_commit.author.email == '29139614+renovate[bot]@users.noreply.github.com' ||
      github.event.head_commit.committer.email == '29139614+renovate[bot]@users.noreply.github.com')

    steps:
      - name: Initialize doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log into K8s cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 zau-k8s

      - name: Deploy image to cluster
        run: kubectl set image deployment/ui-dev ui-dev=ghcr.io/vzauartcc/ui:${{ github.sha }} --record -n zau-staging-web-stack

      - name: Verify deployment
        run: kubectl rollout status deployment/ui-dev -n zau-staging-web-stack
