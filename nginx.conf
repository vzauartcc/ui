user nginx;
worker_processes auto;
error_log /dev/stderr debug;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
	use epoll;
	multi_accept on;
}

http {
	include 				/etc/nginx/mime.types;
	default_type 			application/octet-stream;
	client_max_body_size	200M;

	server_tokens off;

	# 1. Trust the ingress-nginx internal cluster IPs to find the real IP
    # 10.244.0.0/16 is typical for K8s pod CIDR, adjusting to 0.0.0.0/0 is easiest inside the cluster
	set_real_ip_from		0.0.0.0/0;
    real_ip_header			X-Forwarded-For;
    real_ip_recursive		on;

	log_format main '[$time_iso8601] $status $request_method $request_uri ($body_bytes_sent)B | Client:$remote_addr | ReqTime:${request_time}s UpstreamTime:${upstream_response_time}s';

	access_log /dev/stdout main;
	error_log /dev/stderr debug;

	sendfile on;
	tcp_nopush on;
    tcp_nodelay on;
	keepalive_timeout 65;

	server {
		root /usr/share/nginx/html;

		location ^~ /api {
			rewrite ^/api/(.*)$ /$1 break;
			proxy_pass https://api.zauartcc.org;
			proxy_ssl_server_name on;

			# Restore real client IP from Cloudflare
			proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

			proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
		}

		location ^~ /devapi {
			rewrite ^/devapi/(.*)$ /$1 break;
			proxy_pass https://devapi.zauartcc.org;
			proxy_ssl_server_name on;

			# Restore real client IP from Cloudflare
			proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

			proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
		}

		location ^~ /metar {
			rewrite ^/metar/(.*)$ /$1 break;
			proxy_pass https://metar.vatsim.net;
			proxy_ssl_server_name on;

			# Restore real client IP from Cloudflare
			proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

			proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
		}

		location ^~ /vatusa {
			rewrite ^/vatusa/(.*)$ /$1 break;
			proxy_pass https://api.vatusa.net/v2;
			proxy_ssl_server_name on;

			# Restore real client IP from Cloudflare
			proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

			proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
		}

		location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
            expires max;
            add_header Cache-Control "public, immutable";
            access_log off; # Turn off asset logs to keep stdout clean
        }

		location / {
			index index.html;
			try_files $uri $uri/ /index.html;

			expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

			# No proxy occurs
		}

		error_page 500 502 503 504 /50x.html;

		location = /50x.html {
			root /usr/share/nginx/html;
		}
	}
}
