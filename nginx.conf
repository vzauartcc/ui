log_format main_custom '[$time_iso8601] $status $request_method $request_uri ($body_bytes_sent)B | Client:$remote_addr | ReqTime:${request_time}s UpstreamTime:${upstream_response_time}s';

server {
	listen 80;
	listen [::]:80;

	root /usr/share/nginx/html;

	server_tokens off;

	# Logging
    access_log /dev/stdout main_custom;

    # Trust ingress proxies for client IP resolution
    set_real_ip_from    0.0.0.0/0;
    real_ip_header      X-Forwarded-For;
    real_ip_recursive   on;

	location /api/ {
		proxy_pass https://api.zauartcc.org/;
		proxy_ssl_server_name on;

		# Restore real client IP from Cloudflare
		proxy_set_header Host $proxy_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
	}

	location /devapi/ {
		proxy_pass https://devapi.zauartcc.org/;
		proxy_ssl_server_name on;

		# Restore real client IP from Cloudflare
		proxy_set_header Host $proxy_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
	}


    # Hashed build assets (immutable — content hash in the filename)
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy no-referrer;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://api.zauartcc.org https://devapi.zauartcc.org https://sfo3.digitaloceanspaces.com https://*.sfo3.digitaloceanspaces.com; object-src 'self' https://charts-v2.aviationapi.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
        access_log off;
    }

	# SPA routing
	location / {
		index index.html;
		try_files $uri $uri/ /index.html;

		add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
		add_header X-Content-Type-Options nosniff;
		add_header X-Frame-Options SAMEORIGIN;
		add_header Referrer-Policy no-referrer;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://api.zauartcc.org https://devapi.zauartcc.org https://sfo3.digitaloceanspaces.com https://*.sfo3.digitaloceanspaces.com; object-src 'self' https://charts-v2.aviationapi.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
	}

	error_page 500 502 503 504 /50x.html;

	location = /50x.html {
		root /usr/share/nginx/html;
	}
}
