log_format main_custom '[$time_iso8601] $status $request_method $request_uri ($body_bytes_sent)B | Client:$remote_addr | ReqTime:${request_time}s UpstreamTime:${upstream_response_time}s';

server {
	listen 80;
	listen [::]:80;

	root /usr/share/nginx/html;

	# Logging
    access_log /dev/stdout main_custom;

    # Trust ingress proxies for client IP resolution
    set_real_ip_from    0.0.0.0/0;
    real_ip_header      X-Forwarded-For;
    real_ip_recursive   on;

	# Compress SPA assets
	gzip on;
	gzip_disable "msie6";
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

	location /api/ {
		proxy_pass https://api.zauartcc.org/;
		proxy_ssl_server_name on;

		# Restore real client IP from Cloudflare
		proxy_set_header Host $proxy_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
	}

	location /devapi/ {
		proxy_pass https://devapi.zauartcc.org;
		proxy_ssl_server_name on;

		# Restore real client IP from Cloudflare
		proxy_set_header Host $proxy_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
	}

	location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
		expires max;
		add_header Cache-Control "public, immutable";
		access_log off; # Turn off asset logs to keep stdout clean
	}

	# SPA routing
	location / {
		index index.html;
		try_files $uri $uri/ /index.html;

		expires -1;
		add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
	}

	error_page 500 502 503 504 /50x.html;

	location = /50x.html {
		root /usr/share/nginx/html;
	}
}
