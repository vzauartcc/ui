log_format main_custom '[$time_iso8601] $status $request_method $request_uri ($body_bytes_sent)B | Client:$remote_addr | ReqTime:${request_time}s UpstreamTime:${upstream_response_time}s';

server {
	listen 80;
	listen [::]:80;

	root /usr/share/nginx/html;

	server_tokens off;

	# Logging
    access_log /dev/stdout main_custom;

    # Trust ingress proxies for client IP resolution
    set_real_ip_from    10.244.0.0/16;
    real_ip_header      CF-Connecting-IP;
    real_ip_recursive   on;

	client_max_body_size 50m;

	location /api/ {
		proxy_pass http://api.zau-web-stack.svc.cluster.local/;

		# Restore real client IP from Cloudflare
		proxy_set_header Host api.zauartcc.org;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
	}

	location /devapi/ {
		proxy_pass http://api-dev.zau-staging-web-stack.svc.cluster.local/;

		# Restore real client IP from Cloudflare
		proxy_set_header Host devapi.zauartcc.org;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;
	}


    # Hashed build assets (immutable — content hash in the filename)
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy no-referrer;
        add_header Content-Security-Policy "base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'self' https://charts-v2.aviationapi.com";
        access_log off;
    }

	# SPA routing
	location / {
		index index.html;
		try_files $uri $uri/ /index.html;

		add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
		add_header X-Content-Type-Options nosniff;
		add_header X-Frame-Options SAMEORIGIN;
		add_header Referrer-Policy no-referrer;
		add_header Content-Security-Policy "base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'self' https://charts-v2.aviationapi.com";
	}

	error_page 500 502 503 504 /50x.html;

	location = /50x.html {
		root /usr/share/nginx/html;
	}
}
